name: Springboot-microservice Docker Build & Push

on:
  push:
    branches:
      - development

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catalogue_db
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u testuser --password=testpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u testuser --password=testpassword --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL ($i/30)..."
            sleep 5
          done

      - name: Build with Maven
        run: mvn -ntp clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t dockdockgo2001/springboot-microservice-catalog:latest .

      - name: Push Docker Image to Docker Hub
        run: docker push dockdockgo2001/springboot-microservice-catalog:latest


